<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrediSeguro Burgos - Solicita tu préstamo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #0072ff, #00c6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #003366;
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 30px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #0072ff;
      outline: none;
      box-shadow: 0 0 5px rgba(0, 114, 255, 0.3);
    }

    button {
      background-color: #0072ff;
      color: white;
      padding: 14px;
      width: 100%;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #005dc8;
    }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>CrediSeguro Burgos</h1>
    <p class="subtitle">Tu préstamo rápido, seguro y sin complicaciones</p>
    <form action="https://formspree.io/f/xjkwyajd" method="POST" enctype="multipart/form-data">
      <input type="text" name="nombre" placeholder="Nombre completo" required>
      <input type="tel" name="telefono" placeholder="Número de teléfono" required>
      <input type="email" name="email" placeholder="Correo electrónico" required>
      <input type="text" name="direccion" placeholder="Dirección completa" required>
      <input type="file" name="documento" accept="image/*,.pdf" required>
      <textarea name="comentarios" rows="4" placeholder="Comentarios adicionales (opcional)"></textarea>
      <button type="submit">Enviar solicitud</button>
    </form>
    <div class="footer-note">
      Todos los datos son tratados con confidencialidad.
    </div>
  </div>
</body>
</html>
